[pytest]
# 只从 testcases 目录找用例，避免误扫到 .venv 等无关目录
testpaths = testcases

# 自动带上 HTML 报告参数，以后直接敲 pytest 就会生成报告
# --self-contained-html 让报告变成单个文件，方便发给别人看
addopts = --html=reports/report.html --self-contained-html --alluredir=reports/allure-results


# 让 pytest 跳过这些目录，不进去找用例
norecursedirs = .venv .idea .pytest_cache __pycache__

# 把 pytest 自己的运行日志写进文件，方便排查问题
log_file = logs/pytest.log
log_file_level = INFO
